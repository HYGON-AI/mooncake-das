name: HCU PR Build & Test

on:
  pull_request:
    branches:
      - v0.3.12.post1_dev
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: hcu-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build-standard:
    name: Build standard wheel
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted]
    timeout-minutes: 120
    container:
      image: ${{ vars.BASE_COMPILE_IMAGE_UBUNTU_PY310 }}
      options: >-
        --volume /opt/hyhal:/opt/hyhal:ro
        --device /dev/kfd:/dev/kfd
        --device /dev/dri:/dev/dri
        --cap-add=SYS_PTRACE
        --privileged
    env:
      CI: "false"
      FREE_BUILD_DIR: "0"
      DTK_PKG_URL: "${{ vars.RESOURCE_SERVER_URL }}/dtk-pkg/dtk26.04/DTK-26.04-rc4-ubuntu20.04-x86_64.tar.gz"
    steps:
      - name: Checkout PR source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: recursive

      - name: Mark workspace safe for git
        run: git config --global --add safe.directory '*'

      - name: Install DTK
        shell: bash
        run: |
          set -Eeuo pipefail
          cd /opt
          wget -q "${DTK_PKG_URL}"
          tarball="$(basename "${DTK_PKG_URL}")"
          tar -xzf "${tarball}"
          ln -s dtk-* dtk

      - name: Build and repair standard wheel
        shell: bash
        run: |
          set -Eeuo pipefail
          export PIP_INDEX_URL="${{ vars.PYPI_URL }}/nightly/dtk2604/+simple/"
          pip_host="${PIP_INDEX_URL#*://}"
          export PIP_TRUSTED_HOST="${pip_host%%[:/]*}"
          export RESOURCE_SERVER_URL="${{ vars.RESOURCE_SERVER_URL }}"
          set +u
          source /opt/dtk/env.sh
          set -u
          pip install patchelf==0.14.5 ciupload
          bash scripts/variant_build.sh standard

          dtk_ver="$(echo "${DTK_PKG_URL}" | grep -oP 'dtk\K[0-9]+\.[0-9]+' | tr -d '.')"
          CIUpload REPAIR \
            --dtk_version "${dtk_ver}" \
            --git_commit "$(git rev-parse --short=6 HEAD)" \
            --outputdir repaired \
            -f mooncake-wheel/dist/*.whl

          wheel_count="$(find repaired -maxdepth 1 -type f -name '*.whl' | wc -l)"
          if [ "${wheel_count}" -ne 1 ]; then
            echo "Expected exactly one repaired standard wheel, found ${wheel_count}" >&2
            find repaired -maxdepth 1 -type f -print || true
            exit 1
          fi
          ls -lh repaired/*.whl

      - name: Upload standard wheel
        uses: actions/upload-artifact@v4
        with:
          name: hcu-wheel-standard
          path: repaired/*.whl
          if-no-files-found: error
          retention-days: 3

      - name: Cleanup build environment
        if: always()
        shell: bash
        run: |
          set -u
          tarball="$(basename "${DTK_PKG_URL}")"
          rm -rf /opt/dtk "/opt/${tarball}"
          rm -rf build mooncake-wheel/dist

  test-standard:
    name: Cross-node test standard wheel
    needs: build-standard
    runs-on: [self-hosted, nmz4]
    timeout-minutes: 30
    env:
      HCU_TEST_IMAGE: "${{ vars.BASE_COMPILE_IMAGE_UBUNTU_PY310 }}"
      HCU_TEST_DTK_PKG_URL: "${{ vars.RESOURCE_SERVER_URL }}/dtk-pkg/dtk26.04/DTK-26.04-rc4-ubuntu20.04-x86_64.tar.gz"
      HCU_TEST_TARGET_HOST: nmz4
      HCU_TEST_INITIATOR_HOST: nmz36
      HCU_TEST_REMOTE_USER: github
      PIP_INDEX_URL: "${{ vars.PYPI_URL }}/nightly/dtk2604/+simple/"
    steps:
      - name: Checkout test script
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download standard wheel
        uses: actions/download-artifact@v4
        with:
          name: hcu-wheel-standard
          path: artifacts/standard

      - name: Run standard wheel cross-node test
        shell: bash
        run: |
          set -Eeuo pipefail
          mapfile -t wheels < <(find artifacts/standard -maxdepth 1 -type f -name '*.whl' -print)
          if [ "${#wheels[@]}" -ne 1 ]; then
            echo "Expected exactly one standard wheel, found ${#wheels[@]}" >&2
            exit 1
          fi
          bash scripts/test_hcu_standard_wheel.sh "${wheels[0]}"

      - name: Upload cross-node test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hcu-standard-cross-node-logs
          path: ${{ runner.temp }}/hcu-standard-logs/*.log
          if-no-files-found: warn
          retention-days: 7

  hcu-pr-gate:
    name: HCU PR Gate
    if: always()
    needs:
      - build-standard
      - test-standard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require build and cross-node test success
        shell: bash
        env:
          BUILD_RESULT: ${{ needs.build-standard.result }}
          TEST_RESULT: ${{ needs.test-standard.result }}
        run: |
          set -Eeuo pipefail
          printf 'Build standard wheel: %s\n' "${BUILD_RESULT}"
          printf 'Cross-node test:     %s\n' "${TEST_RESULT}"

          if [ "${BUILD_RESULT}" != "success" ] || [ "${TEST_RESULT}" != "success" ]; then
            echo "::error::HCU PR validation failed or was skipped."
            exit 1
          fi

          echo "Standard wheel build and cross-node test passed."

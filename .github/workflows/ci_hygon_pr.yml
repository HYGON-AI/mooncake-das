name: HCU PR CI

# Independent job graph: existing upstream workflows keep their own triggers.
# Enable only after configuring isolated runners and hcu-ci environment review.
on:
  pull_request_target:
    branches: [main, official_code_ci]
    types: [labeled]

permissions:
  contents: read

concurrency:
  group: hcu-upstream-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  hcu:
    if: >-
      vars.HCU_CI_ENABLED == 'true' &&
      github.event.label.name == 'run-hygon-ci' &&
      github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/ci_hygon.yaml
    with:
      checkout_ref: ${{ github.event.pull_request.head.sha }}

  cleanup-label:
    needs: hcu
    if: always() && needs.hcu.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - name: Remove request label
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh pr edit "$PR_NUMBER" --remove-label run-hygon-ci

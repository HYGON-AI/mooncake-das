name: Release HCU

on:
  push:
    branches:
      - v0.3.13.post1_dev
  workflow_dispatch:

jobs:
  publish:
    name: Publish ${{ matrix.build_variant }} wheel (dtk${{ matrix.dtk_line }}-py${{ matrix.py }})
    runs-on: [self-hosted, Linux, X64, hcu]
    container:
      # DTK 预装基础镜像 (自带 /opt/dtk), 换 DTK 版本 = 换镜像 tag, 不再 CI 内装 DTK
      image: ${{ vars.HARBOR_SITE }}/hcu/base/dtk:${{ matrix.dtk_image_tag }}
      options: >-
        --volume /opt/hyhal:/opt/hyhal:ro
        --device /dev/kfd:/dev/kfd
        --device /dev/dri:/dev/dri
        --cap-add=SYS_PTRACE
        --privileged
    permissions:
      contents: read
      checks: read
      pull-requests: read
    strategy:
      # 全平铺 include 矩阵 (GH 的 include 命中已有组合时会合并而非新增, 故不放公共轴):
      #   dtk_line      DTK 大版本标识 (26041/2610), 决定 pip nightly 索引与 CIUpload 归档
      #   dtk_image_tag vars.HARBOR_SITE/hcu/base/dtk: 下的 DTK 预装镜像 tag
      #   py            镜像/构建的 Python 版本段 (3.10/3.12)
      # dtk2610 新增目标: 全部 variant 只上 py312 (2610 线口径只到 py3.12), 不打 rpc
      matrix:
        include:
          # ---- dtk26041 线 ----
          - dtk_line: "26041"
            py: "3.10"
            dtk_image_tag: "26.04.1-ubuntu22.04-py3.10"
            build_variant: standard
          - dtk_line: "26041"
            py: "3.12"
            dtk_image_tag: "26.04.1-ubuntu22.04-py3.12"
            build_variant: standard
          - dtk_line: "26041"
            py: "3.10"
            dtk_image_tag: "26.04.1-ubuntu22.04-py3.10"
            build_variant: shca
          - dtk_line: "26041"
            py: "3.12"
            dtk_image_tag: "26.04.1-ubuntu22.04-py3.12"
            build_variant: shca
          # ---- dtk2610 线 (新增, 全部只上 py312) ----
          - dtk_line: "2610"
            py: "3.12"
            dtk_image_tag: "26.10-ubuntu22.04-py3.12"
            build_variant: standard
          - dtk_line: "2610"
            py: "3.12"
            dtk_image_tag: "26.10-ubuntu22.04-py3.12"
            build_variant: shca
    env:
      CI: "false"
      FREE_BUILD_DIR: "0"
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Mark workspace safe for git (container runs as root)
        run: git config --global --add safe.directory '*'

      # 基础镜像已预装对应版本 DTK (/opt/dtk + env), 无需安装

      - name: Build, repair and upload wheels
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CI_TOKEN: ${{ secrets.DASHUB_CI_TOKEN }}
          DASHUB_BASE: ${{ vars.DASHUB_BASE }}
        run: |
          DTK_VER="${{ matrix.dtk_line }}"
          export PIP_INDEX_URL="${{ vars.PYPI_URL }}/nightly/dtk${DTK_VER}/+simple/"
          export DEVPI_URL="${{ vars.PYPI_URL }}/"
          PIP_HOST="${PIP_INDEX_URL#*://}"
          export PIP_TRUSTED_HOST="${PIP_HOST%%[:/]*}"
          export RESOURCE_SERVER_URL="${{ vars.RESOURCE_SERVER_URL }}"
          export GOPROXY="${GOPROXY:-https://goproxy.cn,https://goproxy.io,direct}"
          source /opt/dtk/env.sh
          pip install patchelf==0.14.5
          bash scripts/variant_build.sh ${{ matrix.build_variant }}
          pip install ciupload
          CIUpload REPAIR --dtk_version ${DTK_VER} --git_commit $(git rev-parse --short=6 HEAD) --outputdir repaired -f mooncake-wheel/dist/*.whl
          CIUpload NIGHTLY \
            --devpi_url "${DEVPI_URL}" \
            --password "${{ secrets.PYPI_PASSWORD }}" \
            --dtk_version "${DTK_VER}" \
            --record \
            --repo "${GITHUB_WORKSPACE}" \
            -f repaired/*.whl
      - name: Cleanup environment
        if: always()
        run: |
          rm -rf build mooncake-wheel/dist

name: Release HCU

on:
  push:
    branches:
      - v0.3.13.post1_dev
  workflow_dispatch:

jobs:
  publish:
    name: Publish ${{ matrix.build_variant }} wheel (dtk${{ matrix.dtk_version }}-py${{ matrix.py }})
    runs-on: [self-hosted, Linux, X64, hcu1]
    container:
      image: ${{ vars.HARBOR_SITE }}/hcu/base/dtk:${{ matrix.dtk_version }}-ubuntu22.04-py${{ matrix.py }}
      options: >-
        --volume /opt/hyhal:/opt/hyhal:ro
        --device /dev/kfd:/dev/kfd
        --device /dev/dri:/dev/dri
        --cap-add=SYS_PTRACE
        --privileged
    permissions:
      contents: read
      checks: read
      pull-requests: read
    strategy:
      matrix:
        build_variant: [standard, shca, rpc]
        include:
          - dtk_version: "26.10"
            py: "3.12"
    env:
      CI: "false"
      FREE_BUILD_DIR: "0"
      DTK_VERSION: ${{ matrix.dtk_version }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Mark workspace safe for git (container runs as root)
        run: git config --global --add safe.directory '*'


      - name: Build, repair and upload wheels
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CI_TOKEN: ${{ secrets.DASHUB_CI_TOKEN }}
          DASHUB_BASE: ${{ vars.DASHUB_BASE }}
        run: |
          DTK_VER="${DTK_VERSION//./}"
          export PIP_INDEX_URL="${{ vars.PYPI_URL }}/nightly/dtk${DTK_VER}/+simple/"
          export DEVPI_URL="${{ vars.PYPI_URL }}/"
          PIP_HOST="${PIP_INDEX_URL#*://}"
          export PIP_TRUSTED_HOST="${PIP_HOST%%[:/]*}"
          export RESOURCE_SERVER_URL="${{ vars.RESOURCE_SERVER_URL }}"
          export GOPROXY="${GOPROXY:-https://goproxy.cn,https://goproxy.io,direct}"
          source /opt/dtk/env.sh
          pip install patchelf==0.14.5
          bash scripts/variant_build.sh ${{ matrix.build_variant }}
          pip install ciupload
          CIUpload REPAIR --dtk_version ${DTK_VER} --git_commit $(git rev-parse --short=6 HEAD) --outputdir repaired -f mooncake-wheel/dist/*.whl
          CIUpload NIGHTLY \
            --devpi_url "${DEVPI_URL}" \
            --password "${{ secrets.PYPI_PASSWORD }}" \
            --dtk_version "${DTK_VER}" \
            --record \
            --repo "${GITHUB_WORKSPACE}" \
            -f repaired/*.whl
      - name: Cleanup environment
        if: always()
        run: |
          rm -rf build mooncake-wheel/dist
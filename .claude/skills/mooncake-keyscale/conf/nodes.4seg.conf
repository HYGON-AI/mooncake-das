# ─────────────────────────────────────────────────────────────────────
# 4 segments / 4 holders. The writer is a pure client on the master node and
# mounts no segment.
#
# Purpose
#   Environment self-check, smoke test, and quick validation when only two
#   machines are reachable. This is not the ~403M-key configuration (that one
#   is nodes.6seg.conf).
#
# Layout (node names, IPs and devices are placeholders -- replace them)
#   master + writer : node-a
#   holder1..4      : node-b
#
# Capacity (computed for 64GiB segments)
#   67,108,864 per segment -> 268,435,456 total
#   master RSS ~= 1210 B/key ~= 302 GiB; the master node needs ~332 GiB free
#   The segments below are small (1GB, ~1,048,576 keys each) to validate wiring
#   and eviction quickly rather than to test capacity
#
# Columns (4 to 6, the last two are optional)
#   role            master | writer | holderN. Exactly one master and one writer
#   ssh_host        name the driver uses to ssh to that node
#   container       docker container for that role (required; there is no default)
#   local_hostname  client IP of that segment, unique within the metadata domain
#   devices         NIC names exactly as `ibv_devices` lists them, e.g. mlx5_0
#                   on Mellanox or shca_0 on Hygon. mlx5_0... below are
#                   PLACEHOLDERS, replace them with your card names.
#                   '-' or omitting the column = auto-discover all usable HCAs.
#   segment_size    optional, size of this segment; when omitted the global
#                   SEGMENT_SIZE applies. The writer mounts nothing, use '-'
#
# With only 5 columns the 5th is classified by content: something that looks
# like a size is segment_size, anything else is devices.
#
# Tips
#   - segments = holder rows; one distinct IP per segment
#   - one card per segment is easier to debug; several cards = multi-rail and
#     MR/QP counts grow with the card count (each segment below lists 4 cards;
#     trim to 1 for single rail)
#   - give every holder the same size
# ─────────────────────────────────────────────────────────────────────
master   node-a  container_name  192.0.2.10  -                               -
writer   node-a  container_name  192.0.2.11  mlx5_0,mlx5_1,mlx5_2,mlx5_3     -
holder1  node-b  container_name  192.0.2.21  mlx5_0,mlx5_1,mlx5_2,mlx5_3     1GB
holder2  node-b  container_name  192.0.2.22  mlx5_0,mlx5_1,mlx5_2,mlx5_3     1GB
holder3  node-b  container_name  192.0.2.23  mlx5_0,mlx5_1,mlx5_2,mlx5_3     1GB
holder4  node-b  container_name  192.0.2.24  mlx5_0,mlx5_1,mlx5_2,mlx5_3     1GB

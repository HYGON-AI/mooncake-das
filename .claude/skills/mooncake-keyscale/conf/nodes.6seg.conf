# ─────────────────────────────────────────────────────────────────────
# 6 segments / 6 holders (64GiB x 6 = 402,653,184 keys). The writer is a pure
# client: it mounts no segment, provides no memory, and shares the master node.
#
# This is a REFERENCE configuration: the segment count was chosen for the
# master node's memory limit, it is not a requirement. Run `plan` first on a
# new environment; if it does not fit, drop segments or shrink the segments.
#
# Layout (node names, IPs and devices are placeholders -- replace them)
#   master + writer : node-a   master keeps metadata only; writer only writes
#   holder1..3      : node-b
#   holder4..6      : node-c
#
# Why the master sits on node-a
#   6 x 64GiB needs about 453 GiB of master RSS, so the master node must have
#   at least 453 + 30 GiB available. Pick the node with the most free memory.
#   Segments never exceed 64Mi objects each; master memory is the real limit.
#
# Capacity (per segment 64GiB)
#   67,108,864 keys per segment -> 402,653,184 total (~403M)
#   master RSS ~= 1210 B/key ~= 453 GiB
#
# Columns (4 to 6, the last two are optional)
#   role            master | writer | holderN. Exactly one master and one writer
#   ssh_host        name the driver uses to ssh to that node
#   container       docker container for that role (required; there is no default)
#   local_hostname  client IP of that segment. Must be unique within the metadata
#                   domain; segments on one machine must all differ
#   devices         NIC names exactly as `ibv_devices` lists them, e.g. mlx5_0
#                   on Mellanox or shca_0 on Hygon. mlx5_0... below are
#                   PLACEHOLDERS, replace them with your card names.
#                   Comma separated = multi-rail. Use '-' or omit the column to
#                   let the engine auto-discover every usable HCA on the node.
#   segment_size    optional, size of this segment, e.g. 64GiB; when omitted the
#                   global SEGMENT_SIZE applies. The writer mounts nothing, use '-'
#
# With only 5 columns the 5th is classified by content: something that looks
# like a size (64GiB/1GB/...) is segment_size, anything else is devices.
#
# Device/IP sanity check (only needed with explicit devices)
#   ls /sys/class/infiniband/<dev>/device/net   -> which ib port it maps to
#   ip -4 -o addr show <ib port>                -> the subnet of that port
#   With explicit devices the IP must live in that card's subnet.
#
# Tips
#   - segments = holder rows; neither master nor writer is a segment
#   - one card per segment = single rail, easier to debug; several cards =
#     multi-rail, higher bandwidth but MR/QP counts grow with the card count
#     (every segment below lists 4 cards; trim to 1 if you want single rail)
#   - give every holder the same size so the smallest one is not the eviction
#     bottleneck
#   - expected master_active_clients = number of holders (writer not counted)
# ─────────────────────────────────────────────────────────────────────
master   node-a  container_name  192.0.2.10  -                               -
writer   node-a  container_name  192.0.2.11  mlx5_0,mlx5_1,mlx5_2,mlx5_3     -
holder1  node-b  container_name  192.0.2.21  mlx5_0,mlx5_1,mlx5_2,mlx5_3     64GiB
holder2  node-b  container_name  192.0.2.22  mlx5_0,mlx5_1,mlx5_2,mlx5_3     64GiB
holder3  node-b  container_name  192.0.2.23  mlx5_0,mlx5_1,mlx5_2,mlx5_3     64GiB
holder4  node-c  container_name  192.0.2.31  mlx5_0,mlx5_1,mlx5_2,mlx5_3     64GiB
holder5  node-c  container_name  192.0.2.32  mlx5_0,mlx5_1,mlx5_2,mlx5_3     64GiB
holder6  node-c  container_name  192.0.2.33  mlx5_0,mlx5_1,mlx5_2,mlx5_3     64GiB
